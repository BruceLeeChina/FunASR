server {
    listen 80;
    server_name _;

    # 反向代理 API 到 Flask app
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;

        # 增加超时时间
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 允许大文件上传
        client_max_body_size 50M;
    }

    # 直接提供 HLS 静态文件 - 修复路径
    location /hls/ {
        alias /app/data/hls/;  # 明确指定到 hls 子目录
        autoindex on;  # 启用目录索引，方便调试

        # MIME 类型 - 移除内部的 add_header 指令
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # 默认类型
        default_type application/octet-stream;

        # CORS 头部
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

        # 缓存控制
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        # 允许 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    # 文档目录访问 - 处理HTML文件
    location /doc/ {
        alias /usr/share/nginx/doc/;
        # 自动添加.html扩展名
        try_files $uri $uri.html $uri/ =404;

        # 设置正确的MIME类型
        types {
            text/html html htm;
            text/css css;
            application/javascript js;
            text/plain txt;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            application/json json;
            application/pdf pdf;
        }
        default_type text/html;

        # 缓存控制
        expires 1h;
        add_header Cache-Control "public, max-age=3600";

        # 允许目录列表
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # 如果访问/doc重定向到/doc/
        if (-d $request_filename) {
            rewrite [^/]$ $uri/ permanent;
        }
    }
    # 处理Markdown文件重定向到HTML（如果需要）
    location ~ \.md$ {
        rewrite ^/(.*)\.md$ /doc/$1.html permanent;
    }
}

server {
    listen       443 ssl;
    server_name  _;

	ssl_certificate      /etc/nginx/cert/mk-cert.pem;
    ssl_certificate_key  /etc/nginx/cert/mk-key.pem;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 设置根目录为新的静态资源路径
    root /usr/share/nginx/doc/funasr-online/static;

    # 默认首页
    index index.html;

    # 静态资源缓存设置
    expires 1d;
    add_header Cache-Control "public, no-transform";

    # 处理所有请求 - 单页应用配置
    location / {
        # 单页应用路由回退：如果请求的文件不存在，则返回 index.html
        try_files $uri $uri/ /index.html;

        # 添加 CORS 头（如果不需要可以移除）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
    }

    # 处理静态资源（CSS、JS、图片等）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav|txt|json)$ {
        # 静态资源使用更长的缓存时间
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 尝试直接访问文件，如果不存在则不回退到 index.html
        try_files $uri =404;
    }

    # 处理音频等大文件
    location ~* \.(mp3|wav|ogg|flac)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 错误页面处理
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
